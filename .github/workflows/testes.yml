name: Testes e segurança
on: [push, pull_request]

# O workflow só pode ler o código (privilégio mínimo)
permissions:
  contents: read

jobs:
  # Cada serviço tem os seus próprios testes e roda sozinho, como no mundo real
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projeto: [gateway, servicos/usuarios, servicos/inventario, servicos/chamados, servicos/notificacoes]
    defaults:
      run:
        working-directory: ${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes (inclui testes de segurança)
        run: pytest -q
      - name: Dependências com falhas conhecidas
        run: pip-audit -r requirements.txt

  # Confere se o docker-compose.yml é válido (sem subir nada)
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose config --quiet
